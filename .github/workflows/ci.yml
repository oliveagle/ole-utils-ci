# The two CI pipelines of this repository.
#
# Every job writes down the mode it runs in and pins it in the environment:
#
#   DEVINE_UTILS_REQUIRE_MODE=ci   the authoritative job; nothing lowers it
#   DEVINE_UTILS_REQUIRE_MODE=dev  the fast job; a smoke test, not a verdict
#
# The tool enforces the pin: a job that asks for another mode is refused, and
# inside CI the fast build driver is refused as well, so no job can answer
# from a cache that leaves a test or a lint out.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run both pipelines on demand against any branch:
  #   gh workflow run ci --ref main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fast:
    name: fast (smoke test)
    runs-on: ubuntu-latest
    env:
      # Declared on purpose: this job is the developer's loop. It is quick
      # because it runs the changed crates and leaves the slow gates out, and
      # it is not the verdict — the `full` job is.
      DEVINE_UTILS_REQUIRE_MODE: dev
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history, so the diff against the event's base can be
          # computed.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build --all-targets --locked
      - name: resolve the diff base
        id: base
        # `--mode dev` narrows the run to the crates changed since a base, and
        # a fixed `main` is the same commit as HEAD on a push to main — every
        # compiling gate would report "no crate changed" and answer from
        # nothing. Take the base the event names: the pull request's base
        # commit, else the previous tip of the pushed branch, else the parent
        # commit. A base git cannot resolve is not dangerous: the tool then
        # runs everything instead of narrowing.
        run: |
          zeros="0000000000000000000000000000000000000000"
          pr_base="${{ github.event.pull_request.base.sha }}"
          push_base="${{ github.event.before }}"
          if [ -n "$pr_base" ] && git cat-file -e "${pr_base}^{commit}" 2>/dev/null; then
            base="$pr_base"
          elif [ -n "$push_base" ] && [ "$push_base" != "$zeros" ] \
            && git cat-file -e "${push_base}^{commit}" 2>/dev/null; then
            base="$push_base"
          else
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "diff base: $(git log -1 --format='%h %s' "$base")" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: the toolchain gates
        run: ./target/debug/devine-utils-ci rust all --mode dev --base-branch "${{ steps.base.outputs.base }}"

  full:
    name: full (the gate)
    runs-on: ubuntu-latest
    env:
      # The authoritative job. The mode cannot be lowered in this job.
      DEVINE_UTILS_REQUIRE_MODE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build --all-targets --locked
      - uses: taiki-e/install-action@cargo-deny
      - name: every gate
        run: ./target/debug/devine-utils-ci all --mode ci
      - name: credential scan
        run: ./target/debug/devine-utils-ci ci-go-env
