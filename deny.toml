# The dependency policy of this repository, checked by `cargo deny`.
#
# `devine-utils-ci rust-audit` runs `cargo deny check` against this file, so
# the policy is part of the gate and not a document that can drift away from
# it.

[graph]
all-features = true
# The tree is audited for the platform this repository builds and releases:
# linux-x86_64, the same platform CI and the release artifacts use. The
# crates that exist only for other targets (the `windows-*` family and
# `wasm-bindgen`) would otherwise drag in a second `syn` that is never
# compiled here.
targets = ["x86_64-unknown-linux-gnu"]

[licenses]
# The permissive set a Rust binary may ship under. Every crate in the tree
# offers one of these; `cargo deny` rejects anything else.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
# An allow-list entry that no crate offers today is not a problem: the list
# is the set of licenses this project accepts, not a report of the tree.
unused-allowed-license = "allow"

[bans]
# A second copy of a crate in one build is a mistake, not a warning.
multiple-versions = "deny"
wildcards = "deny"
skip = [
    # `toml` 0.9 depends on winnow 0.7 directly and on winnow 1.0 through
    # its own `toml_parser`. Both versions are upstream's choice; our own
    # code touches neither of them.
    { crate = "winnow", reason = "toml 0.9 pulls in winnow 0.7 directly and winnow 1.0 through toml_parser" },
]

[advisories]
# No advisory is ignored, and none has to be: the four notices this file
# used to list came from the terminal half of `toon-format` (syntect,
# ratatui) and from `serde_yaml` (unsafe-libyaml). That tree is gone, so
# every crate the binary ships is maintained.
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
