[package]
name = "devine-utils-ci"
version = "0.15.0"
edition = "2021"
rust-version = "1.85"
description = "Unified CI quality-gate tool — Rust rewrite of devine-utils-ci"
license = "Apache-2.0"
repository = "https://github.com/oliveagle/ole-utils-ci"
readme = "README.md"
keywords = ["ci", "quality-gate", "lint", "rust"]
categories = ["development-tools", "command-line-utilities"]
autobins = false

[[bin]]
name = "devine-utils-ci"
path = "src/main.rs"

[[bin]]
name = "ole-utils-ci"
path = "src/bin/ole_utils_ci.rs"

[[bin]]
name = "ole-utils-golang"
path = "src/bin/ole_utils_golang.rs"

[[bin]]
name = "ole-utils-rust"
path = "src/bin/ole_utils_rust.rs"

[[bin]]
name = "ole-utils-tengo"
path = "src/bin/ole_utils_tengo.rs"

[[bin]]
name = "ole-utils-proto"
path = "src/bin/ole_utils_proto.rs"

[[bin]]
name = "ole-utils-web"
path = "src/bin/ole_utils_web.rs"

[[bin]]
name = "ole-utils-python"
path = "src/bin/ole_utils_python.rs"

[[bin]]
name = "ole-utils-mojo"
path = "src/bin/ole_utils_mojo.rs"

[[bin]]
name = "ole-utils-common"
path = "src/bin/ole_utils_common.rs"
[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
globset = "0.4"
ignore = "0.4"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
serde_norway = "0.9"
thiserror = "2"
toml = "0.9"
toon-format = { version = "0.7", default-features = false }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = 1

[workspace.metadata.blaze]
version = "0.20261029.7"
